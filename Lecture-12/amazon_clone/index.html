<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAZON CLONE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./assets/amazon_logo.png" >
</head>
<body>
    
    <header>
        <nav>
            <!-- amazon logo -->
            <a href="#">
                <img width="100" src="./assets/amazon_logo.png" alt="">
            </a>

            <!-- location -->
            <div class="nav-location">
                <img src="./assets/location_icon.png" height="20" alt="">
                <div>
                    <p>Deliver to</p>
                    <h1>Delhi, India</h1>
                </div>
            </div>
            <!-- search bar -->
             <div class="nav-search">
                <div class="nav-search-category">
                    <p>All</p>
                    <img height="12" src="./assets/dropdown_icon.png" alt="">
                </div>
                <input class="nav-search-input" placeholder="Search Amazon..." type="text" name="" id="">
                <img class="nav-search-icon" src="./assets/search_icon.png" alt="">
             </div>
             <!-- language -->
             <div class="nav-language">
                <img width="25" src="./assets/us_flag.png" alt="">
                <p>EN</p>
                <img width="8" src="./assets/dropdown_icon.png" alt="">
             </div>

             <!-- location -->
            <div class="nav-text">
                <p>Hello, Signin</p>
                <h1>Account & Lists
                    <img height="8" src="./assets/dropdown_icon.png" alt="">
                </h1>
            </div>
            
            <!-- return an order -->
            <div class="nav-text">
                <p>Return</p>
                <h1>& Order </h1>
            </div>

            <!-- cart -->
             <a href="#" class="nav-cart">
                <img width="35" src="./assets/cart_icon.png" alt="">
                <h4>Cart</h4>
             </a>
        </nav>
    </header>

    <main>
        <!-- slider images -->
        <div class="main-slider">
            <a class="control-prev" href="#"> &#8592; </a>
            <a class="control-next" href="#"> &#8594; </a>
            <ul>
                <img class="slider-img" src="./assets/header1.jpg" alt="">
                <img class="slider-img" src="./assets/header2.jpg" alt="">
                <img class="slider-img" src="./assets/header3.jpg" alt="">
                <img class="slider-img" src="./assets/header4.jpg" alt="">
                <img class="slider-img" src="./assets/header5.jpg" alt="">
                <img class="slider-img" src="./assets/header6.jpg" alt="">
            </ul>
        </div>
        <!-- 4 cardbox -->
        <div class="box-row">
            <div class="box-col">
                <h3>Starting ₹199 | Dry fruits & seeds</h3>
                <img src="./assets/box1-1.jpg" alt="">
                <a href="#">Show more</a>
            </div>
            <div class="box-col">
                <h3>Starting ₹299 | Dry fruits & seeds</h3>
                <img src="./assets/box1-2.jpg" alt="">
                <a href="#">Show more</a>
            </div>
            <div class="box-col">
                <h3>Starting ₹399 | Dry fruits & seeds</h3>
                <img src="./assets/box1-3.jpg" alt="">
                <a href="#">Show more</a>
            </div>
            <div class="box-col">
                <h3>Starting ₹499 | Dry fruits & seeds</h3>
                <img src="./assets/box1-4.jpg" alt="">
                <a href="#">Show more</a>
            </div>
        </div>

    </main>
    <footer></footer>


    <script src="app.js"></script>
</body>
</html>
